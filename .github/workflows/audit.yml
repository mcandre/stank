---
name: "Audit"
on: # yamllint disable-line rule:truthy
  push:
  pull_request:
  schedule:
  - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: "read"
  issues: "write"
  pull-requests: "write"
jobs:
  Audit:
    runs-on: "ubuntu-24.04"
    steps:
    - uses: "actions/checkout@v7"
    - uses: "actions/setup-go@v7"
      with:
        go-version: "1.27.0"
    - run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck -scan package ./...
